name: matchme
description: A proximity-first connection network.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- RIVERPOD 3 & STATE MANAGEMENT ---
  flutter_riverpod: ^3.1.0
  connectivity_plus: ^7.0.0

  # --- SUPABASE & BACKEND ---
  supabase_flutter: ^2.12.0
  http: ^1.6.0

  # --- PUSH NOTIFICATIONS ---
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.0.0

  # --- LOCATION & BACKGROUND ---
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  battery_plus: ^7.0.0

  # --- UI & UTILITIES ---
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  image_picker: ^1.2.0
  camera: ^0.12.0
  file_picker: ^10.3.8
  extended_image: ^10.0.1
  image: ^4.8.0
  uuid: ^4.5.1
  collection: ^1.19.1
  syncfusion_flutter_datepicker: ^33.1.44
  url_launcher: ^6.3.0
  riverpod_annotation: ^4.0.0
  emoji_picker_flutter: ^4.4.0  # Added for WhatsApp-style categorized emoji picker

  # --- Locale Detection ---
  device_info_plus: ^12.3.0
  crypto: ^3.0.2

  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  proj4dart: ^2.1.0
 
  # --- Local Database (Hive) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- Local Notifications ---
  flutter_local_notifications: ^21.0.0

  auto_size_text: ^3.0.0
  permission_handler: ^12.0.1
  quick_actions: ^1.1.0
  web: ^1.1.1
  device_calendar_plus: ^0.3.0
  googleapis: ^16.0.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  aad_oauth: ^1.0.1
  flutter_dotenv: ^6.0.0
  
  # --- PAYMENTS ---
  purchases_flutter: ^9.12.0
  purchases_ui_flutter: ^9.12.0
  share_plus: ^12.0.1

  # --- WebView (MediaPipe gesture capture on mobile/desktop) ---
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  webview_flutter_wkwebview: ^3.14.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # --- Build runner & Riverpod 3 Generators ---
  build_runner: ^2.10.4
  riverpod_generator: ^4.0.0+1

  # Riverpod annotations used by generators
  # riverpod_annotation: ^3.0.3

# dependency_overrides:
  #   freezed_annotation: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/
    - assets/images/providers/
    - assets/twemoji/
    - assets/verification_capture/

  fonts:
    - family: "Noto Color Emoji"
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    - family: "Noto Sans"
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: "Noto Sans Hebrew"
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
    - family: "Noto Sans Arabic"
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: "Noto Sans TC"
      fonts:
        - asset: assets/fonts/NotoSansTC-Regular.ttf
        - asset: assets/fonts/NotoSansTC-Bold.ttf
          weight: 700
    - family: "Noto Sans Symbols"
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
    - family: "Noto Sans Symbols2"
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: "Noto Serif"
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 24
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: "assets/images/logo.png"

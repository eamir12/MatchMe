name: matchme
description: A proximity-first connection network.
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- RIVERPOD 3 & STATE MANAGEMENT ---
  flutter_riverpod: ^3.3.2
  connectivity_plus: ^7.3.1

  # --- SUPABASE & BACKEND ---
  supabase_flutter: ^2.17.1
  http: ^1.6.0
  web_socket_channel: ^3.0.1

  # --- PUSH NOTIFICATIONS ---
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

  # --- LOCATION & BACKGROUND ---
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  battery_plus: ^7.1.1

  # --- UI & UTILITIES ---
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.0
  camera: ^0.12.0+2
  # `camera` does not endorse a Windows implementation, so availableCameras()
  # throws MissingPluginException there unless this is listed explicitly. It
  # supplies CameraPlatform for Windows (Media Foundation preview/capture); no
  # flash/exposure/zoom/orientation support, which this app never uses.
  camera_windows: ^0.3.0+1
  file_picker: ^12.3.0
  extended_image: ^10.1.0
  image: ^4.8.0
  uuid: ^4.6.0
  collection: ^1.19.1
  characters: ^1.3.0
  syncfusion_flutter_datepicker: ^35.1.42
  url_launcher: ^6.3.0
  flutter_svg: ^2.3.0
  riverpod_annotation: ^4.0.3
  emoji_picker_flutter: ^4.5.3  # Added for WhatsApp-style categorized emoji picker
  cached_network_image: ^4.0.5  # For caching sponsored ad images
  cupertino_icons: ^2.0.0

  # --- Locale Detection ---
  device_info_plus: ^13.3.0
  crypto: ^3.0.2

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  proj4dart: ^3.0.0
 
  # --- Encryption & Secure Storage ---
  cryptography: ^2.7.0
  # Two-step upgrade (done): v9 -> v10 shipped first and migrated the Android
  # cipher layer (EncryptedSharedPreferences -> Keystore ciphers, verified in
  # the field); v11 then removes the deprecated encryptedSharedPreferences
  # parameter and the v9->v10 migration path. NEVER ship v11 before a device
  # that still holds v9 data has run a v10 build — v10 is the only bridge.
  # v10 also dragged win32 ^6 via flutter_secure_storage_windows 4.x, which is
  # why device_info_plus/share_plus/package_info_plus/file_picker are on their
  # win32-6 majors (see above).
  flutter_secure_storage: ^11.2.0

  # --- Local Database (Hive) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Direct because the notification avatar mirror resolves its own directory
  # with it (already in the tree via hive_flutter).
  path_provider: ^2.1.0

  # --- Local Notifications ---
  flutter_local_notifications: ^22.3.0
  confetti: ^0.8.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.0

  auto_size_text: ^3.0.0
  app_links: ^7.2.1
  permission_handler: ^13.0.2

  # --- VOICE GUIDANCE (on-device text-to-speech for wizard/verification coaching) ---
  flutter_tts: ^4.2.0
  quick_actions: ^1.1.0
  visibility_detector: ^0.4.0+2
  web: ^1.1.1
  device_calendar_plus: ^0.12.0
  googleapis: ^17.0.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  aad_oauth: ^1.0.1
  msal_auth: ^3.5.2
  flutter_dotenv: ^6.0.0
  passkeys: ^2.22.1
  
  # --- PAYMENTS ---
  purchases_flutter: ^10.16.0
  purchases_ui_flutter: ^10.16.0
  share_plus: ^13.3.1
  # Transitive (via geolocator_linux); pinned to 10.x so its win32 ^6
  # requirement stays compatible with flutter_secure_storage 10+/11.
  package_info_plus: ^10.2.2

  # --- GOOGLE MOBILE ADS ---
  google_mobile_ads: ^9.1.0

  # --- WebView (MediaPipe gesture capture on mobile/desktop) ---
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.0
  webview_flutter_wkwebview: ^3.26.0

  # --- Desktop window control (pull the app window back to the front after the
  #     system-browser OAuth round trip; see utils/desktop_window_focus.dart) ---
  window_manager: ^0.5.2
  webview_windows: ^0.4.0
  vector_tile: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # MSIX packaging for Windows WNS push (package identity required for
  # PushNotificationChannelManager). Run: dart run msix:create
  msix: ^3.16.9

  # --- Build runner & Riverpod 3 Generators ---
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4

  # --- Testing Libraries ---
  mockito: ^5.3.0
  mocktail: ^1.0.0

  # The vendored realtime client the app talks to. Imported directly by the
  # realtime regression tests (they drive a real Phoenix socket against a
  # local fake server). Must stay in sync with the dependency_overrides entry
  # below.
  realtime_client:
    path: third_party/realtime_client


  # Riverpod annotations used by generators
  # riverpod_annotation: ^3.0.3

dependency_overrides:
  # camera 0.12.x still constrains its iOS implementation to 0.10.x. Use the
  # current Darwin implementation, which matches this app's camera platform
  # interface and Flutter SDK.
  camera_avfoundation: 0.11.0
  passkeys_android:
    path: third_party/passkeys_android
  realtime_client:
    path: third_party/realtime_client
  # MatchMe fork: Windows C++ patched to never InvokeMethod from background
  # threads (MediaEnded / SpeakComplete waiters) which the engine rejects with
  # shell.cc "non-platform thread" errors (upstream dlutton/flutter_tts#629).
  # Dart on Windows uses estimated durations, not completion callbacks.
  flutter_tts:
    path: third_party/flutter_tts
  # MatchMe fork: upstream CMakeLists uses DEPENDS with the TARGET form of
  # add_custom_command, which new CMake rejects (CMP0175 warning). Fixed here.
  webview_windows:
    path: third_party/webview_windows
  # MatchMe fork: upstream 3.5.3 applies kotlin-android unconditionally from its
  # Android plugins {} block, which trips Flutter's "plugins that apply KGP"
  # warning and would break under android.builtInKotlin=true. One-line patch,
  # see third_party/README.md.
  msal_auth:
    path: third_party/msal_auth
  # MatchMe fork: aad_oauth 1.0.1 (latest upstream) pins flutter_secure_storage
  # ^9.0.0. Two patches: constraint relaxed to ^11.0.0, and config.dart's
  # default AndroidOptions(encryptedSharedPreferences: true) -> AndroidOptions()
  # (v11 removed the parameter). Needed by Microsoft calendar OAuth
  # (calendar_sync_service.dart).
  aad_oauth:
    path: third_party/aad_oauth
  # MatchMe fork: android_file_picker 1.1.1 does extensions.getByName("flutter"),
  # which throws when Gradle evaluates this plugin before :app (alphabetical
  # order: android_file_picker < app). Patched to findByName + fallback to 36.
  android_file_picker:
    path: third_party/android_file_picker
  # MatchMe fork: all three apply kotlin-android from a conditional block, which
  # is still enough for Flutter's text-scan KGP warning (conditionals are
  # ignored by the regex) and will hard-fail future Flutter. Each is a
  # delete-the-apply-line patch relying on the root shim; see README.md.
  emoji_picker_flutter:
    path: third_party/emoji_picker_flutter
  firebase_core:
    path: third_party/firebase_core
  # MatchMe fork: make Google Sign-In resolve alongside firebase-ios-sdk 13
  # under SPM. It pins GoogleSignIn-iOS to upstream commit 4ce331c (allows
  # AppCheckCore 12.x and GTMSessionFetcher 4.x/5.x); upstream 6.3.8 still pins
  # GoogleSignIn 9.x, which allows neither.
  google_sign_in_ios:
    path: third_party/google_sign_in_ios
  # MatchMe fork: remove the textually-declared kotlin-android (KGP warning).
  # Keep its version equal to purchases_flutter: both plugins pin the same
  # purchases-hybrid-common, and mismatched pins break iOS SPM resolution.
  purchases_ui_flutter:
    path: third_party/purchases_ui_flutter
  # MatchMe fork: keep the channel-based 2.4.28 implementation and harden its
  # legacy serialized-list migration. R8 builds could persist Kotlin EmptyList
  # descriptors that the plugin later rejected, preventing startup.
  shared_preferences_android:
    path: third_party/shared_preferences_android
  # freezed_annotation: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/msal_config.json
    - assets/images/
    - assets/images/providers/
    - assets/twemoji/
    - assets/verification_capture/
    - assets/verification_gestures/
    - assets/meetup_selfie/
    - assets/photo_prescreen/
    # Same detector script the web build serves from the site root; bundled
    # here so the Windows WebView2 prescreen page can load it.
    - web/photo_prescreen.js
    # Legal documents, one directory per language. Each language directory must
    # be listed individually: a directory asset entry does not pick up files in
    # its subdirectories, so `docs/legal/` on its own would bundle nothing and
    # the legal screen would show "could not be loaded" in production.
    - docs/legal/en/
    - docs/legal/es/
    - docs/legal/he/

  fonts:
    - family: "Noto Sans"
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: "Noto Sans Hebrew"
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
    - family: "Noto Sans Arabic"
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: "Noto Sans Symbols"
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
    - family: "Noto Sans Symbols2"
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: "Noto Serif"
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    # Bundled color emoji (Twemoji COLR v0.7.0, CC-BY-4.0 + Apache-2.0).
    # Bundled-to-bundled fallback works on Android where bundled->system
    # does not (flutter/flutter#175653), so this guarantees color ⛱️ etc.
    # on the sender device, not just the receiver.
    - family: "Twemoji Mozilla"
      fonts:
        - asset: assets/fonts/TwemojiMozilla.ttf

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "tools/icons/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 8
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  # Bare colorful rosette (no "MatchMe" wordmark inside the icon - the OS
  # renders the name under the icon). Regenerate sources with:
  #   dart run tools/generate_app_icon.dart && dart run flutter_launcher_icons
  image_path: "tools/icons/app_icon.png"

msix_config:
  # Identity copied from Microsoft Partner Center (App | Product identity):
  # Package/Identity/Name + Publisher + PublisherDisplayName. The WNS Package
  # SID is bound to this identity, so all five must stay in sync with
  # Partner Center — see docs/windows-wns-push.md for the full setup.
  display_name: MatchMe
  publisher_display_name: EAmir
  publisher: CN=D489A069-197E-4A4C-A149-FCF350D3685A
  identity_name: EAmir.MatchMeApp
  msix_version: 1.0.0.0
  # webcam: packaged apps can only open the camera with this device
  # capability declared (unpackaged runs rely on the Windows privacy setting).
  capabilities: internetClient, webcam
  # Toast activation launches the app via protocol (matchme://chat/<id>).
  protocol_activation: matchme
  logo_path: tools/icons/app_icon.png
  architecture: x64


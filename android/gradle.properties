# JVM Configuration - Aggressive for faster builds
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.16.8-hotspot
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200

# Parallel & Caching - Aggressive
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.workers.max=16

# Kotlin & Android Optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=daemon
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=byte-buddy
android.nonTransitiveRClass=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Build Optimizations
android.enableAapt2=true
android.enableDexingArtifactTransform=true
android.useNewApkCreator=true

# Disable unnecessary features
android.enableOnDemandModules=false
android.enableResourceOptimizations=true
# Flutter currently auto-applies the legacy Kotlin plugin to Android plugins.
# Keep AGP's built-in Kotlin disabled until that upstream incompatibility is fixed.
android.builtInKotlin=false
android.newDsl=false
kotlin_version=2.4.10

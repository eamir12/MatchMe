<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --capture-top-inset: max(12px, calc(env(safe-area-inset-top, 0px) + 12px));
      /* Pin the instruction card to the bottom edge: hug the screen bottom
         just above the system navigation (viewport-fit=cover lets env()
         resolve on notch/gesture devices). Tighter than before so the card
         no longer floats mid-screen. */
      --capture-bottom-inset: max(8px, calc(env(safe-area-inset-bottom, 0px) + 8px));
    }
    body { font-family: system-ui, sans-serif; background: #000; color: #fff; overflow: hidden; }
    body.rtl { direction: rtl; }
    #container { position: relative; width: 100vw; height: 100vh; }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #overlay { position: absolute; inset: 0; }
    #topHud { pointer-events: none; position: absolute; top: var(--capture-top-inset); left: 12px; right: 58px; display: flex; justify-content: center; z-index: 4; }
    #instruction { text-align: center; padding: 8px 14px; background: rgba(0, 0, 0, 0.62); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px; font-size: 0.92rem; font-weight: 600; max-width: min(70vw, 320px); white-space: normal; line-height: 1.2; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28); backdrop-filter: blur(8px); }
    #gestureExample { pointer-events: none; position: relative; width: 78px; height: 78px; border-radius: 18px; background: rgba(0, 200, 83, 0.14); border: 2px solid rgba(0, 200, 83, 0.55); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35); flex: 0 0 auto; }
    #gestureExampleEmoji { width: 48px; height: 48px; display: block; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45)); }
    #gestureExampleEmoji.mirror-x { display: inline-block; transform: scaleX(-1); }
    #gestureExampleHand { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); padding: 1px 9px; border-radius: 999px; background: #00c853; color: #06281a; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; line-height: 1.6; white-space: nowrap; }
    #feedback { pointer-events: none; position: absolute; top: var(--capture-top-inset); right: 12px; width: 36px; height: 36px; border-radius: 999px; background: rgba(0, 0, 0, 0.58); border: 1px solid rgba(255, 255, 255, 0.15); display: flex; align-items: center; justify-content: center; transition: background 0.25s, border-color 0.25s, opacity 0.25s; opacity: 0.78; z-index: 4; }
    #feedback.ready { background: rgba(0, 200, 83, 0.92); border-color: rgba(0, 200, 83, 0.95); opacity: 1; }
    #feedback svg { width: 18px; height: 18px; opacity: 0.72; }
    #feedback.ready svg { opacity: 1; }
    .roi { pointer-events: none; position: absolute; border: 2px solid rgba(255, 255, 255, 0.55); border-radius: 18px; transition: border-color 0.2s, background 0.2s; }
    .roi.active { border-color: rgba(0, 200, 83, 0.95); background: rgba(0, 200, 83, 0.12); }
    #faceRoi { width: 50vw; max-width: 390px; min-width: 236px; height: 43vh; max-height: 372px; min-height: 246px; top: 9%; left: 50%; transform: translateX(-50%); border-radius: 42% 42% 46% 46% / 48% 48% 42% 42%; }
    #gestureRoi { width: 56vw; max-width: 410px; min-width: 280px; height: 29vh; max-height: 270px; min-height: 182px; top: 68%; right: 6%; border-radius: 24px; }
    #gestureRoi.left { right: auto; left: 10%; }
    @media (orientation: landscape) {
      #faceRoi { width: 38vw; max-width: 430px; min-width: 250px; height: 48vh; max-height: 330px; min-height: 220px; top: 7%; }
      #gestureRoi { width: 37vw; max-width: 380px; min-width: 250px; height: 35vh; max-height: 275px; min-height: 178px; top: 65%; right: 7%; }
      #gestureRoi.left { left: 10%; }
    }
    /* Fixed to the visual viewport (not the container): an absolute bottom
       anchor can float when the container/viewport heights disagree in some
       WebViews, leaving video visible under the card. Fixed + bottom padding
       pins the card to the true screen bottom on every platform. */
    #bottomPanel { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px var(--capture-bottom-inset); display: flex; flex-direction: column; align-items: center; z-index: 4; }
    #detailCard { pointer-events: none; width: min(100%, 410px); padding: 10px 12px; border-radius: 16px; background: rgba(0, 0, 0, 0.56); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28); backdrop-filter: blur(10px); }
    #detailHeader { display: flex; align-items: center; gap: 10px; }
    #detailText { min-width: 0; flex: 1 1 auto; }
    #gestureDescription { font-size: 0.84rem; line-height: 1.25; color: rgba(255, 255, 255, 0.9); }
    #checklist { margin-top: 8px; width: 100%; display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; gap: 6px 12px; }
    .checkItem { display: inline-flex; align-items: center; justify-content: flex-start; gap: 7px; color: rgba(255, 255, 255, 0.72); font-size: 0.8rem; line-height: 1.15; white-space: nowrap; flex: 0 0 auto; }
    .checkDot { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, 0.38); display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; flex: 0 0 auto; }
    .checkItem.complete { color: #fff; }
    .checkItem.complete .checkDot { background: rgba(0, 200, 83, 0.95); border-color: rgba(0, 200, 83, 0.95); color: #fff; }
    #status { pointer-events: none; font-size: 0.84rem; margin-top: 8px; text-align: center; min-height: 1.25em; color: rgba(255, 255, 255, 0.95); }
    @keyframes statusWrongHandFlash {
      0%, 100% { color: #ffeb3b; background-color: rgba(255, 82, 82, 0); }
      50% { color: #ffffff; background-color: rgba(255, 82, 82, 0.38); }
    }
    #status.wrongHand { font-weight: 700; border-radius: 8px; animation: statusWrongHandFlash 0.65s ease-in-out infinite; }
    #progressWrap { pointer-events: none; position: static; width: 100%; margin-top: 8px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.2); overflow: hidden; }
    #progressBar { width: 0%; height: 100%; background: linear-gradient(90deg, #42a5f5, #00c853); transition: width 0.15s linear; }
    #captureBar { position: static; width: 0; height: 0; overflow: hidden; pointer-events: none; }
    #captureWrap { display: flex; flex-direction: column; align-items: center; }
    #captureBtn { width: 1px; height: 1px; border: 0; padding: 0; opacity: 0; pointer-events: none; position: absolute; }
    #captureBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #captureBtn.ready { background: rgba(0, 200, 83, 0.9); }
    #captureBtn svg { width: 36px; height: 36px; }
    body.rtl #detailCard,
    body.rtl #gestureDescription,
    body.rtl #status { text-align: right; }
    body.rtl #detailHeader { flex-direction: row-reverse; }
    body.rtl #checklist { direction: rtl; flex-direction: row; justify-content: flex-start; }
    body.rtl .checkItem { direction: rtl; flex-direction: row-reverse; justify-content: flex-end; text-align: right; }
    body.rtl .checkItem span:last-child { text-align: right; }
    .hidden { display: none !important; }
    #errorCard { position: absolute; left: 16px; right: 16px; top: 50%; transform: translate(-50%, -50%); left: 50%; width: min(92vw, 380px); padding: 18px 16px; border-radius: 16px; background: rgba(20, 20, 22, 0.94); border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); z-index: 10; text-align: center; }
    #errorTitle { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    #errorDetail { font-size: 0.82rem; line-height: 1.4; color: rgba(255, 255, 255, 0.75); margin-bottom: 14px; word-break: break-word; }
    #retryBtn { min-width: 140px; padding: 10px 22px; border: 0; border-radius: 999px; background: #00c853; color: #fff; font-size: 0.95rem; font-weight: 700; }
    #debugOverlay { position: absolute; left: 8px; bottom: 8px; max-width: 92vw; padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.72); color: #7dffb0; font-family: monospace; font-size: 10px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; z-index: 9; pointer-events: none; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay">
      <div id="topHud">
        <div id="instruction"></div>
      </div>
      <div id="feedback"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg></div>
      <div id="faceRoi" class="roi"></div>
      <div id="gestureRoi" class="roi"></div>
      <div id="bottomPanel">
        <div id="detailCard">
          <div id="detailHeader">
            <div id="gestureExample"><img id="gestureExampleEmoji" alt=""><span id="gestureExampleHand" class="hidden"></span></div>
            <div id="detailText">
              <div id="gestureDescription"></div>
            </div>
          </div>
          <div id="checklist">
            <div class="checkItem" id="checkFace"><span class="checkDot">✓</span><span id="checkFaceLabel"></span></div>
            <div class="checkItem" id="checkHand"><span class="checkDot">✓</span><span id="checkHandLabel"></span></div>
            <div class="checkItem" id="checkGesture"><span class="checkDot">✓</span><span id="checkGestureLabel"></span></div>
            <div class="checkItem" id="checkLight"><span class="checkDot">✓</span><span id="checkLightLabel"></span></div>
          </div>
          <div id="status"></div>
          <div id="progressWrap"><div id="progressBar"></div></div>
        </div>
        <div id="captureBar">
          <div id="captureWrap">
            <button id="captureBtn" disabled aria-hidden="true" tabindex="-1"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <canvas id="canvas" class="hidden"></canvas>
  <canvas id="qualityCanvas" class="hidden"></canvas>
  <div id="errorCard" class="hidden">
    <div id="errorTitle"></div>
    <div id="errorDetail"></div>
    <button id="retryBtn" type="button"></button>
  </div>
  <div id="debugOverlay" class="hidden"></div>
   <script>
      window.__REQUIRED_GESTURE_CODE__ = __GESTURE_CODE_JSON__;
      window.__REQUIRED_GESTURE_LABEL__ = __GESTURE_LABEL_JSON__;
      window.__REQUIRED_GESTURE_DESCRIPTION__ = __GESTURE_DESCRIPTION_JSON__;
      window.__LOCALE_CODE__ = __LOCALE_CODE_JSON__;
      window.__CAPTURE_STRINGS__ = __CAPTURE_STRINGS_JSON__;
      window.__INPUT_IMAGE_BASE64__ = __INPUT_IMAGE_BASE64_JSON__;
      window.__CAPTURE_DEBUG__ = __CAPTURE_DEBUG_JSON__;
      // Bottom inset in CSS px, measured by the host app (MediaQuery padding).
      // Takes precedence over the env() guess below: the host knows whether
      // the WebView already ends above opaque system bars (inset ~0, card
      // hugs the bottom) or underlaps them (inset = bar height, card clears
      // the buttons). Null/non-number keeps the CSS default (web popup).
      window.__BOTTOM_INSET_PX__ = __BOTTOM_INSET_JSON__;
   </script>
  <script type="module">
(function() {
  var FPS = 10;
  var FPS_SLOW = 5;
  var READY_STABLE_MS = 600;
  var READY_STABLE_MS_SLOW = 900;
  var STABLE_FRAMES_REQUIRED = 6;
  var SCORE_WINDOW_SIZE = 15;
  var PASS_SCORE_MIN = 0.62;
  var FACE_HIT_MIN = 0.7;
  var GESTURE_HIT_MIN = 0.55;
  var CAPTURE_SELECTION_MS = 600;
  // Primary-selfie (FACE_ONLY) gates: the instructions are spoken aloud and
  // take several seconds, so the face must hold steady inside the green oval
  // much longer than a gesture shot before auto-capture may fire.
  var READY_STABLE_MS_FACE_ONLY = 2000;
  var STABLE_FRAMES_REQUIRED_FACE_ONLY = 12;
  var CAPTURE_SELECTION_MS_FACE_ONLY = 1000;
  // Minimum face-centering quality (0..1, distance of the face-box center to
  // the oval center) for the face to count as "inside the green circle".
  var FACE_ROI_SCORE_MIN = 0.55;
  // FACE_ONLY captures are cropped to the green oval: for a primary face
  // picture, the area inside the oval is the photo and everything outside it
  // is irrelevant. The minimum crop size (in sensor pixels) keeps the result
  // above the photo prescreen's resolution floor; the crop expands
  // symmetrically around the oval when the oval maps to a smaller region.
  var FACE_CROP_MIN_DIM = 520;
  // Minimum page-open time before a primary selfie may auto-capture, so the
  // spoken instructions always finish first even if TTS signalling is lost.
  var FACE_ONLY_MIN_OPEN_MS = 4500;
  // Live lighting gate: mean luma (0..255) of the detected face box must
  // reach this before any readiness gate counts a frame. 51 = 0.20 x 255
  // matches the face-region darkness rule in photo_prescreen_service.dart so
  // live gating and the post-capture prescreen agree on "too dark".
  var FACE_LUMA_MIN = 51;
  var FACE_STALE_MS = 900;
  var FACE_STALE_MS_SLOW = 1800;
  var MAX_CAPTURE_ATTEMPTS = 12;
  var GESTURE_SCORE_MIN = 0.38;
  var GESTURE_STRONG_MIN = 0.50;
  var HAND_ROI_MIN = 0.16;
  var FACE_EDGE_MARGIN = 0.035;
  var FACE_MIN_SIZE = 0.12;
  // The preview is CSS-mirrored (scaleX(-1)) so it behaves like a mirror,
  // but MediaPipe sees the raw unmirrored sensor frame. Detector coordinates
  // must therefore be mapped into display space before comparing them with
  // the on-screen guides. Front-camera mirroring behaviour differs between
  // devices/WebViews, so handedness is also treated as advisory (see below).
  var MIRRORED_PREVIEW = true;
  var SLOW_INFER_MS = 140;
  var MODEL_LOAD_TIMEOUT_MS = 12000;
  var MAX_SNAPSHOT_DIM = 1280;
  var STUCK_REPORT_MS = 8000;
  // How long the preview may deliver zero frames (models already loaded)
  // before the page gives up with a retryable error instead of stalling.
  var VIDEO_STALL_FATAL_MS = 8000;
  // Handedness enforcement (see computeChirality/decideHandVerdict).
  // MediaPipe's handedness label is the primary cue: the capture page feeds
  // the recognizer the raw unmirrored frame, and since tasks-vision v0.10.5
  // the model reports the subject's own hand on such input (the "assumes
  // mirrored" note in older docs is stale). CHIRALITY_SIGN_FOR_RIGHT maps
  // each canonical gesture class to the expected sign of the display-space
  // thumb-side test for an ANATOMICAL right hand presented palm-out (the
  // instructed pose): wrist->middle-MCP axis vs thumb position gives cross
  // < 0 for a right hand, > 0 for a left hand. A palm-side vs back-of-hand
  // presentation flips that sign while the label stays correct, which is why
  // this geometry is only a fallback for frames WITHOUT a hand label (soft,
  // never a blocker); the per-gesture magnitude floors below tolerate
  // side-view presentations (thumbs) and tucked thumbs (pointing). If field
  // data ever contradicts a sign, flip that entry (and only it) - the
  // fallback resolver degrades to tolerant mode, never to a block.
  var CHIRALITY_SIGN_FOR_RIGHT = {
    'CLOSED_FIST': -1,
    'OPEN_PALM': -1,
    'VICTORY': -1,
    'POINTING_UP': -1,
    'THUMB_UP': -1,
    'THUMB_DOWN': -1
  };
  var CHIRALITY_MIN_MAGNITUDE = 0.12;
  var CHIRALITY_MIN_MAGNITUDE_THUMBS = 0.06;
  var CHIRALITY_MIN_AXIS_LEN = 0.02;
  var WRONG_HAND_MIN_LABEL_SCORE = 0.5;
  var MEDIAPIPE_SOURCES = [
    {
      moduleUrl: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs',
      wasmRootUrl: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'
    },
    {
      moduleUrl: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs',
      wasmRootUrl: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm'
    }
  ];
  var selectedMediaPipeSource = null;

  var gestureRequirements = {
    'CLOSED_FIST_RIGHT_HAND': { gesture: 'Closed_Fist', hand: 'Right' },
    'CLOSED_FIST_LEFT_HAND': { gesture: 'Closed_Fist', hand: 'Left' },
    'OPEN_PALM_RIGHT_HAND': { gesture: 'Open_Palm', hand: 'Right' },
    'OPEN_PALM_LEFT_HAND': { gesture: 'Open_Palm', hand: 'Left' },
    'PEACE_SIGN_RIGHT_HAND': { gesture: 'Victory', hand: 'Right' },
    'PEACE_SIGN_LEFT_HAND': { gesture: 'Victory', hand: 'Left' },
    'POINTING_UP_RIGHT_HAND': { gesture: 'Pointing_Up', hand: 'Right' },
    'POINTING_UP_LEFT_HAND': { gesture: 'Pointing_Up', hand: 'Left' },
    'THUMBS_DOWN_RIGHT_HAND': { gesture: 'Thumb_Down', hand: 'Right' },
    'THUMBS_DOWN_LEFT_HAND': { gesture: 'Thumb_Down', hand: 'Left' },
    'THUMBS_UP_RIGHT_HAND': { gesture: 'Thumb_Up', hand: 'Right' },
    'THUMBS_UP_LEFT_HAND': { gesture: 'Thumb_Up', hand: 'Left' }
  };

  var gestureParam = (typeof window.__REQUIRED_GESTURE_CODE__ === 'string' && window.__REQUIRED_GESTURE_CODE__)
    ? window.__REQUIRED_GESTURE_CODE__.toUpperCase().replace(/-/g, '_')
    : (new URLSearchParams(window.location.search).get('gesture') || '').toUpperCase().replace(/-/g, '_');
  var localeCode = (typeof window.__LOCALE_CODE__ === 'string' && window.__LOCALE_CODE__)
    ? window.__LOCALE_CODE__.toLowerCase()
    : ((new URLSearchParams(window.location.search).get('locale') || 'en').toLowerCase());
  var isRtlLocale = localeCode === 'he' || localeCode.indexOf('he-') === 0;
  // Face-only mode (primary profile selfie): no hand gesture is required.
  // Readiness gates purely on a single clear face inside the face oval.

  // stays disabled until then (plus FACE_ONLY_MIN_OPEN_MS), so the photo is

  };

    // finish. That signal can be lost (TTS finishes before the page's module

  var requiredGesture = requirement.gesture;
  var requiredHand = requirement.hand || null;
  // Bundled hand illustrations (Microsoft Fluent Emoji 3D, MIT), inlined as
  // base64 PNG data URIs so the capture view never depends on the platform's
  // emoji fonts. All six Fluent drawings depict a LEFT hand: fist, palm,
  // peace and pointing were validated per gesture against the real left hand
  // in the mirrored camera preview; thumbs-up was user-reported after
  // shipping the mirrored copy; thumbs-down is the thumbs-up art rotated
  // 180 degrees (pixel-tested, rot180 preserves handedness). Mirroring the
  // drawing only for right-hand requests therefore always shows the correct

  // sensor frame. During static input-image analysis the bitmap held by
  // <canvas> is sampled instead of the camera.
  function sampleFaceBoxLuma(faceLandmarks) {
    try {
      if (!faceLandmarks || !faceLandmarks.length) return null;
      var minX = 1, minY = 1, maxX = 0, maxY = 0;
      for (var i = 0; i < faceLandmarks.length; i++) {
        var p = faceLandmarks[i];
        if (!p) continue;
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      if (maxX <= minX || maxY <= minY) return null;
      var src = null, srcW = 0, srcH = 0;
      if (video && video.readyState >= 2 && video.videoWidth) {
        src = video;
        srcW = video.videoWidth;
        srcH = video.videoHeight;
      } else if (usingInputImage && canvas && canvas.width) {
        src = canvas;
        srcW = canvas.width;
        srcH = canvas.height;
      }
      if (!src || !srcW || !srcH) return null;
      // 10% pad keeps a stray landmark from shrinking the sample region.
      var padX = (maxX - minX) * 0.1;
      var padY = (maxY - minY) * 0.1;
      var sx = Math.max(0, minX - padX) * srcW;
      var sy = Math.max(0, minY - padY) * srcH;
      var sw = Math.min(1, maxX + padX) * srcW - sx;
      var sh = Math.min(1, maxY + padY) * srcH - sy;
      if (!(sw >= 4) || !(sh >= 4)) return null;
      if (!lumaSampleCanvas) lumaSampleCanvas = document.createElement('canvas');
      lumaSampleCanvas.width = 32;
      lumaSampleCanvas.height = 32;
      var lc = lumaSampleCanvas.getContext('2d', { willReadFrequently: true });
      lc.drawImage(src, sx, sy, sw, sh, 0, 0, 32, 32);
      var data = lc.getImageData(0, 0, 32, 32).data;
      var sum = 0;
      for (var j = 0; j < data.length; j += 4) {
        sum += 0.299 * data[j] + 0.587 * data[j + 1] + 0.114 * data[j + 2];
      }
      return sum / (data.length / 4);
    } catch (_) {
      return null;
    }
  }

  function computeFaceQuality(faceLandmarks) {
    var box = getFaceBox(faceLandmarks);
    if (!box) return { score: 0, centered: 0, sizeScore: 0, stability: 0, box: null };
    var targets = getLayoutTargets();
    var targetCx = targets.faceCx;
    var targetCy = targets.faceCy;
    var dx = Math.abs(box.cx - targetCx);
    var dy = Math.abs(box.cy - targetCy);
    var centered = clamp(1 - ((dx / targets.faceCenterXRange) + (dy / targets.faceCenterYRange)) * 0.5, 0, 1);
    var area = box.width * box.height;
    var sizeScore = clamp((area - 0.045) / 0.08, 0, 1);
    var stability = 1;
    if (previousFaceCenter) {
      var jitter = Math.hypot(box.cx - previousFaceCenter.x, box.cy - previousFaceCenter.y);
      stability = clamp(1 - (jitter / 0.07), 0, 1);
    }
    previousFaceCenter = { x: box.cx, y: box.cy };
    var score = (centered * 0.4) + (sizeScore * 0.4) + (stability * 0.2);
    return { score: score, centered: centered, sizeScore: sizeScore, stability: stability, box: box };
  }

  function computeRoiScores(faceQuality, handCenter) {
    var targets = getLayoutTargets();
    var faceRoiScore = 0;
    if (faceQuality && faceQuality.box) {
      var dx = Math.abs(faceQuality.box.cx - targets.faceCx);
      var dy = Math.abs(faceQuality.box.cy - targets.faceCy);
      faceRoiScore = clamp(1 - ((dx / targets.faceRoiXRange) + (dy / targets.faceRoiYRange)) * 0.5, 0, 1);
    }
    var handTargetX = requiredHand === 'Left' ? targets.handLeftX : targets.handRightX;
    var handTargetY = targets.handY;
    var handRoiScore = 0;
    if (handCenter) {
      var hdx = Math.abs(handCenter.x - handTargetX);
      var hdy = Math.abs(handCenter.y - handTargetY);
      handRoiScore = clamp(1 - ((hdx / targets.handXRange) + (hdy / targets.handYRange)) * 0.5, 0, 1);
    }
    return { faceRoiScore: faceRoiScore, handRoiScore: handRoiScore };
  }

  function getLayoutTargets() {
    var faceRect = getNormalizedRect(faceRoiEl) || {
      cx: 0.5,
      cy: 0.39,
      width: 0.52,
      height: 0.49
    };
    var gestureRect = getNormalizedRect(gestureRoiEl) || getDefaultGestureRoiTarget();
    return {
      faceCx: faceRect.cx,
      faceCy: faceRect.cy,
      faceCenterXRange: Math.max(faceRect.width * 0.32, 0.18),
      faceCenterYRange: Math.max(faceRect.height * 0.3, 0.18),
      faceRoiXRange: Math.max(faceRect.width * 0.52, 0.24),
      faceRoiYRange: Math.max(faceRect.height * 0.52, 0.24),
      handRightX: gestureRect.cx,
      handLeftX: gestureRect.cx,
      handY: gestureRect.cy,
      handXRange: Math.max(gestureRect.width * 0.92, 0.34),
      handYRange: Math.max(gestureRect.height * 0.96, 0.34)
    };
  }

  function computeImageQuality() {
    try {
      if (video.videoWidth <= 0 || video.videoHeight <= 0) return null;
      var w = slowDevice ? 120 : 160;
      var h = Math.round((video.videoHeight / video.videoWidth) * w);
      if (h < 90) h = 90;
      qualityCanvas.width = w;
      qualityCanvas.height = h;
      qctx.save();
      qctx.scale(-1, 1);
      qctx.drawImage(video, -w, 0, w, h);
      qctx.restore();
      var imageData = qctx.getImageData(0, 0, w, h);
      var d = imageData.data;
      var n = w * h;
      var sum = 0;
      var sumSq = 0;
      for (var i = 0; i < d.length; i += 4) {
        var y = (0.299 * d[i]) + (0.587 * d[i + 1]) + (0.114 * d[i + 2]);
        sum += y;
        sumSq += y * y;
      }
      var mean = sum / n;
      var variance = (sumSq / n) - (mean * mean);
      var sharpness = clamp(variance / 2600, 0, 1);
      var brightness = clamp(1 - (Math.abs(mean - 135) / 95), 0, 1);
      return { sharpness: sharpness, brightness: brightness };
    } catch (_) {
      return null;
    }
  }

  function buildFrameCandidateQuality(e) {
    var q = computeImageQuality();
    if (!q) return null;
    var quality = (q.sharpness * 0.36) + (q.brightness * 0.18) + (e.frameScore * 0.30) + (e.gestureScore * 0.10) + (e.faceQualityScore * 0.06);
    return {
      quality: quality,
      sharpness: q.sharpness,
      brightness: q.brightness
    };
  }

  function snapshotToDataUrl() {
    // Cap the snapshot resolution: some phones ignore the ideal constraint
    // and return very large frames, which blocks the UI thread for seconds
    // during toDataURL and can OOM low-memory devices.
    var vw = video.videoWidth || 0;
    var vh = video.videoHeight || 0;
    // Primary selfie (FACE_ONLY): the photo is the area inside the green
    // oval — a face picture. Everything outside the oval is irrelevant, so
    // the snapshot is cropped to it. Gesture captures keep the full frame
    // (hand and body context matter there).
    var ovalRect = isFaceOnlyMode ? getFaceOvalCropRect() : null;
    var sx = ovalRect ? ovalRect.x : 0;
    var sy = ovalRect ? ovalRect.y : 0;
    var sw = ovalRect ? ovalRect.w : vw;
    var sh = ovalRect ? ovalRect.h : vh;
    var scale = 1;
    var longest = Math.max(sw, sh);
    if (longest > MAX_SNAPSHOT_DIM) scale = MAX_SNAPSHOT_DIM / longest;
    canvas.width = Math.max(2, Math.round(sw * scale));
    canvas.height = Math.max(2, Math.round(sh * scale));
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, sw, sh, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();
    return canvas.toDataURL('image/jpeg', slowDevice ? 0.85 : 0.92);
  }

  function updateBestFrame(now, e) {
    if (frameQualityCooldown > 0) {
      frameQualityCooldown--;
      return;
    }
    frameQualityCooldown = 1;
    var candidate = buildFrameCandidateQuality(e);
    if (!candidate) return;
    var dataUrl = snapshotToDataUrl();
    if (!bestFrame || candidate.quality > bestFrame.quality) {
      bestFrame = {
        quality: candidate.quality,
        sharpness: candidate.sharpness,
        brightness: candidate.brightness,
        dataUrl: dataUrl,
        ts: now
      };
    }
  }

  function pushScore(sample) {
    scoreWindow.push(sample);
    if (scoreWindow.length > SCORE_WINDOW_SIZE) {
      scoreWindow.shift();
    }
  }

  function summarizeWindow() {
    if (!scoreWindow.length) {
      return { avg: 0, faceHitRate: 0, gestureHitRate: 0 };
    }
    var sum = 0;
    var faceHits = 0;
    var gestureHits = 0;
    for (var i = 0; i < scoreWindow.length; i++) {
      var s = scoreWindow[i];
      sum += s.frameScore;
      if (s.faceOk) faceHits++;
      if (s.gestureStrong) gestureHits++;
    }
    return {
      avg: sum / scoreWindow.length,
      faceHitRate: faceHits / scoreWindow.length,
      gestureHitRate: gestureHits / scoreWindow.length
    };
  }

  function shouldPass(summary) {
    return summary.avg >= PASS_SCORE_MIN &&
      summary.faceHitRate >= FACE_HIT_MIN &&
      summary.gestureHitRate >= GESTURE_HIT_MIN;
  }

  function setRoiState(faceActive, handActive) {
    if (faceActive) faceRoiEl.classList.add('active'); else faceRoiEl.classList.remove('active');
    if (handActive) gestureRoiEl.classList.add('active'); else gestureRoiEl.classList.remove('active');
  }

  function stopStreamTracks() {
    try {
      if (stream && typeof stream.getTracks === 'function') {
        stream.getTracks().forEach(function(t) {
          try { t.stop(); } catch (_) {}
        });
      }
    } catch (_) {}
  }

  function captureFromDataUrl(dataUrl) {
    var base64 = dataUrl.replace(/^data:image\/jpeg;base64,/, '');
    window.sendVerificationPhoto(base64);
    stopStreamTracks();
  }

  function evaluateFrame(faceLandmarks, gestureResults) {
    var facePresent = !!faceLandmarks;
    var fullFaceVisible = facePresent && isFullFaceVisible(faceLandmarks);
    var handLandmarks = getHandLandmarks(gestureResults);
    var handCenter = getHandCenter(handLandmarks);
    var faceObstructed = facePresent && handLandmarks && isFaceObstructed(faceLandmarks, handLandmarks);
    var faceOk = fullFaceVisible && !faceObstructed;
    var faceQuality = facePresent ? computeFaceQuality(faceLandmarks) : { score: 0, box: null };
    // Live lighting gate: mean luma of the face box, temporally smoothed so
    // exposure flicker cannot flap the gate. Fail-open on sampling errors —
    // without a measurement the gate stays permissive and the post-capture
    // prescreen still enforces darkness rules; this gate only blocks when
    // darkness is actually measured. No face box => unknown => not lit.
    var faceLitOk = false;
    if (facePresent && faceQuality.box) {
      var lumaNow = sampleFaceBoxLuma(faceLandmarks);
      if (lumaNow != null) {
        smoothedFaceLuma = (smoothedFaceLuma == null)
          ? lumaNow
          : smoothedFaceLuma * 0.7 + lumaNow * 0.3;
        faceLitOk = smoothedFaceLuma >= FACE_LUMA_MIN;
      } else {
        smoothedFaceLuma = null;
        faceLitOk = true;
      }
    } else {
      smoothedFaceLuma = null;
    }
    var faceLuma = smoothedFaceLuma;
    var roiScores = computeRoiScores(faceQuality, handCenter);
    // "Inside the green circle": the face-box center must be close to the
    // oval center (not merely visible somewhere in the frame). The green
    // oval lights up on this signal, and primary-selfie auto-capture
    // requires it — a face at the frame edge can never trigger capture.
    var faceInsideOval = !!facePresent && !!faceQuality.box && roiScores.faceRoiScore >= FACE_ROI_SCORE_MIN;
    var name = detectGesture(gestureResults);
    var hand = detectHandedness(gestureResults);
    var requiredGestureCanonical = canonicalGestureName(requiredGesture);
    var gestureScore = (name === requiredGestureCanonical) ? detectGestureScore(gestureResults) : 0;
    // Handedness enforcement: the recognizer consumes the raw unmirrored
    // frame, and since tasks-vision v0.10.5 its label reports the subject's
    // own hand on such input, so the label is trusted directly. Only a
    // confident opposite-hand label blocks the gate ('wrong'); a missing
    // label stays tolerant via the pose-geometry fallback so transient label
    // dropouts never reject a compliant user. Server-side AI remains the
    // final arbiter of the photo.
    var chirality = computeChirality(handLandmarks, requiredGestureCanonical);
    var handVerdict = decideHandVerdict({
      requiredHand: requiredHand,
      label: hand,
      labelScore: detectHandednessScore(gestureResults),
      chirality: chirality,
      gestureCanonical: requiredGestureCanonical,
      hasHand: !!handCenter
    });
    var handednessScore = handVerdict.score;
    var matchesHandStrict = handVerdict.verdict === 'pass' && chirality.determinate && hand === requiredHand;
    var matchesHandMirrored = !!hand && hand === oppositeHand(requiredHand);
    var matchesHand = handVerdict.verdict !== 'wrong';
    var matchesGesture = name === requiredGestureCanonical;
    var handPlacementOk = !!handCenter && matchesHand && roiScores.handRoiScore >= HAND_ROI_MIN;
    var gestureDetected = matchesGesture && matchesHand && gestureScore >= GESTURE_SCORE_MIN;
    var occlusionPenalty = faceObstructed ? 0.35 : 0;
    var facePresenceScore = facePresent ? 1 : 0;
    var faceQualityScore = faceOk ? faceQuality.score : 0;
    var frameScore = (0.25 * facePresenceScore) +
      (0.24 * faceQualityScore) +
      (0.24 * gestureScore) +
      (0.14 * handednessScore) +
      (0.07 * roiScores.faceRoiScore) +
      (0.06 * roiScores.handRoiScore) -
      occlusionPenalty;
    frameScore = clamp(frameScore, 0, 1);
    var gestureStrong = matchesGesture && matchesHand && gestureScore >= GESTURE_STRONG_MIN;
    var gestureChecklistReady = matchesGesture && matchesHand && (handPlacementOk || gestureStrong);
    if (isFaceOnlyMode) {
      // No hand or gesture is required: gate purely on the face. Neutralize
      // the gesture terms so the smoothing window, progress bar, checklist,
      // and best-frame quality all work on face criteria alone.
      gestureScore = 1;
      gestureStrong = true;
      handPlacementOk = true;
      gestureDetected = true;
      gestureChecklistReady = true;
      frameScore = clamp(
        (0.45 * facePresenceScore) +
        (0.35 * faceQualityScore) +
        (0.20 * roiScores.faceRoiScore) -
        occlusionPenalty,
        0, 1);
    }
    return {
      faceOk: faceOk,
      faceInsideOval: faceInsideOval,
      facePresent: facePresent,
      faceObstructed: faceObstructed,
      faceLitOk: faceLitOk,
      faceLuma: faceLuma,
      matchesGesture: matchesGesture,
      matchesHand: matchesHand,
      matchesHandStrict: matchesHandStrict,
      matchesHandMirrored: matchesHandMirrored,
      handVerdict: handVerdict.verdict,
      chiralitySign: chirality.sign,
      chiralityMagnitude: Math.round(chirality.magnitude * 100) / 100,
      chiralityOpposes: !!(chirality.determinate && chirality.sign !== (requiredHand === 'Right'
        ? (CHIRALITY_SIGN_FOR_RIGHT[requiredGestureCanonical] || -1)
        : -(CHIRALITY_SIGN_FOR_RIGHT[requiredGestureCanonical] || -1))),
      hintWrongHand: handVerdict.hintWrongHand,
      flipEvidence: handVerdict.flipEvidence,
      handPlacementOk: handPlacementOk,
      gestureDetected: gestureDetected,
      gestureChecklistReady: gestureChecklistReady,
      hand: hand,
      faceBox: faceQuality.box,
      gestureScore: gestureScore,
      faceQualityScore: faceQualityScore,
      handRoiScore: roiScores.handRoiScore,
      frameScore: frameScore,
      gestureStrong: gestureStrong
    };
  }

  function setTickRate(fps) {
    try {
      if (tickTimer) clearInterval(tickTimer);
    } catch (_) {}
    tickTimer = setInterval(tick, 1000 / fps);
  }

  function markSlowDevice() {
    if (slowDevice) return;
    slowDevice = true;
    FACE_STALE_MS = FACE_STALE_MS_SLOW;
    READY_STABLE_MS = READY_STABLE_MS_SLOW;
    setTickRate(FPS_SLOW);
    reportLog('metrics', { event: 'slow-device', inferMsAvg: Math.round(inferMsAvg) });
  }

  function tick() {
    // Guard against overlapping ticks: on slow devices inference can take
    // longer than the interval, and re-entrant MediaPipe VIDEO calls throw.
    if (tickInProgress) return;
    if (!gestureRecognizer || !faceLandmarker) return;
    if (video.readyState < 2 || !video.videoWidth) {
      // Models are loaded but the preview never started delivering frames
      // (autoplay-policy race, wedged camera HAL). This used to stall the
      // page silently forever; surface a retryable error instead.
      if (!videoStallWatchStart) videoStallWatchStart = Date.now();
      if (Date.now() - videoStallWatchStart > VIDEO_STALL_FATAL_MS && !videoStallFatalShown) {
        videoStallFatalShown = true;
        reportLog('stuck', {
          stage: 'videoStalled',
          readyState: video.readyState,
          videoW: video.videoWidth || 0,
          videoH: video.videoHeight || 0
        }, true);
        showFatalError(
          t('verificationCaptureCameraOrModelError', 'Camera or model error: {error}').replace('{error}', 'Camera preview did not start'),
          'Camera preview did not start (readyState ' + video.readyState + ')'
        );
      }
      return;
    }
    videoStallWatchStart = 0;
    tickInProgress = true;
    var now = Date.now();
    if (!firstTickAt) firstTickAt = now;
    var inferStart = 0;
    try {
      inferStart = performance.now();
    } catch (_) {}
    frameIndex++;
    try {
      // MediaPipe VIDEO mode requires strictly increasing timestamps per
      // detector; wall-clock duplicates (coarse timers, throttled intervals)
      // previously threw every frame on some devices.
      if (now <= lastGestureTs) now = lastGestureTs + 1;
      if (frameIndex % 2 === 0) {
        try {
          var faceTs = now <= lastFaceTs ? lastFaceTs + 1 : now;
          var faceResults = faceLandmarker.detectForVideo(video, faceTs);
          lastFaceTs = faceTs;
          var hasFace = !!(faceResults && faceResults.faceLandmarks && faceResults.faceLandmarks.length > 0);
          if (hasFace) {
            lastFaceSeenAt = now;
            lastFaceLandmarks = faceResults.faceLandmarks[0];
          }
        } catch (err) {
          reportLog('warn', { stage: 'face', message: String((err && err.message) || err || '').slice(0, 200) });
        }
      }
      var gestureResults = null;
      if (isFaceOnlyMode) {
        // Face-only mode needs no hand tracking: skip gesture inference
        // entirely (saves per-frame work on low-end devices).
      } else try {
        gestureResults = gestureRecognizer.recognizeForVideo(video, now);
        lastGestureTs = now;
      } catch (err) {
        reportLog('warn', { stage: 'gesture', message: String((err && err.message) || err || '').slice(0, 200) });
      }
      var facePresent = (now - lastFaceSeenAt) < FACE_STALE_MS && !!lastFaceLandmarks;
      var e = evaluateFrame(facePresent ? lastFaceLandmarks : null, gestureResults);
      if (e.flipEvidence) flipFrames++;
      if (!isFaceOnlyMode) {
        setGestureRoiPose(e.faceBox);
      }
      pushScore({ frameScore: e.frameScore, faceOk: e.faceOk, gestureStrong: e.gestureStrong });
      var summary = summarizeWindow();
      var stableFramesNeed = isFaceOnlyMode ? STABLE_FRAMES_REQUIRED_FACE_ONLY : STABLE_FRAMES_REQUIRED;
      var stableMsNeed = isFaceOnlyMode ? READY_STABLE_MS_FACE_ONLY : READY_STABLE_MS;
      var selectionMsNeed = isFaceOnlyMode ? CAPTURE_SELECTION_MS_FACE_ONLY : CAPTURE_SELECTION_MS;
      var progressValue = summary.avg;
      if (isFaceOnlyMode && readySince) {
        // Primary selfie: show hold-steady progress toward auto-capture. The
        // raw frame-quality average plateaus below 100% (centering/stability
        // terms never max out), which users read as "the bar never finishes".
        var holdProgress = Math.min(stableFrames / stableFramesNeed, (now - readySince) / stableMsNeed);
        progressValue = Math.max(progressValue, clamp(holdProgress, 0, 1));
      }
      // A measured-dark face shows no capture progress at all: the bar must
      // never advance while the lighting gate is failing.
      if (e.facePresent && !e.faceLitOk) progressValue = 0;
      setProgress(progressValue);
      var visualHandReady = e.handPlacementOk || e.gestureStrong;
      setChecklistState(e.faceOk, visualHandReady, e.gestureChecklistReady, e.faceLitOk);
      // The green oval lights up only while the face is inside it in
      // primary-selfie mode (not merely visible somewhere in the frame) and
      // the lighting gate passes.
      var faceRoiActive = isFaceOnlyMode ? (e.faceOk && e.faceInsideOval) : e.faceOk;
      faceRoiActive = faceRoiActive && e.faceLitOk;
      setRoiState(faceRoiActive, visualHandReady);

      // Primary selfies additionally require the face inside the oval; a
      // face at the frame edge can satisfy faceOk but must never capture.
      // Every mode additionally requires the lighting gate.
      var faceGateOk = isFaceOnlyMode ? (e.faceOk && e.faceInsideOval) : e.faceOk;
      faceGateOk = faceGateOk && e.faceLitOk;
      var passNow = faceGateOk && visualHandReady && e.gestureChecklistReady;
      // Hysteresis: the smoothed window can carry a single marginal frame so
      // one jittery detection doesn't reset the whole hold-still progress.
      // shouldPass was previously dead code; it now acts as the smoothing gate.
      var windowPass = false;
      try {
        windowPass = shouldPass(summary) && faceGateOk && e.gestureChecklistReady;
      } catch (_) {}
      // Instruction gate: never count progress toward auto-capture while the
      // spoken instructions are still playing (host signals readiness), nor
      // before the minimum page-open time. Gesture flow is unaffected.
      var instructionsReady = true;
      try {
        instructionsReady = !isFaceOnlyMode ||
          (faceOnlyInstructionsReady && (now - bootStart) >= FACE_ONLY_MIN_OPEN_MS);
      } catch (_) {}
      var goodNow = (passNow || windowPass) && instructionsReady;
      if (goodNow) {
        stableFrames++;
        if (!readySince) readySince = now;
      } else {
        // Forgive isolated bad frames instead of resetting to zero.
        stableFrames = Math.max(0, stableFrames - 1);
        if (stableFrames === 0) {
          readySince = null;
          capturePlanned = false;
          captureSelectionStartedAt = null;
          if (ready) {
            ready = false;
            setReady(false);
          }
        }
      }
      var stableMs = readySince ? now - readySince : 0;
      if (goodNow && stableFrames >= stableFramesNeed && stableMs >= stableMsNeed) {
        if (!ready) {
          ready = true;
          setReady(true);
          setStatus(t('verificationCaptureStatusHoldSteady', 'Great, hold steady...'));
          try {
            reportLog('captureTiming', { stage: 'gatePassed', tMs: Date.now() - bootStart }, true);
          } catch (_) {}
        }
        if (!capturePlanned) {
          capturePlanned = true;
          captureSelectionStartedAt = now;
          bestFrame = null;
          try {
            reportLog('captureTiming', { stage: 'selectionStarted', tMs: Date.now() - bootStart }, true);
          } catch (_) {}
        }
        if (!hasCaptured && !usingInputImage) {
          updateBestFrame(now, e);
          if ((now - captureSelectionStartedAt) >= selectionMsNeed) {
            setStatus(t('verificationCaptureStatusCapturingBestFrame', 'Capturing best frame...'));
            tickInProgress = false;
            triggerAutoCapture();
            return;
          }
        } else if (!hasCaptured && usingInputImage) {
          tickInProgress = false;
          triggerAutoCapture();
          return;
        }
      } else if (goodNow) {
        var countdown = Math.max(1, Math.ceil((stableMsNeed - stableMs) / 1000));
        setStatus(t('verificationCaptureStatusHoldSteady', 'Great, hold steady...') + ' ' + countdown);
      }

      // Live lighting gate: the face is found but the scene is too dark —
      // refuse immediately. The ready state (and its enabled capture button)
      // drops on the first measured-dark frame instead of waiting for the
      // stability window to decay, and the reason is shown AND spoken like
      // the wrong-hand correction.
      if (e.facePresent && !e.faceLitOk) {
        if (ready) {
          ready = false;
          setReady(false);
        }
        announceTooDark();
      } else if (!ready) {
        if (isFaceOnlyMode) {
          // Primary selfie guidance: face framing only, no hand prompts.
          // A visible face that is NOT inside the oval must keep hearing
          // "center your face" — never "hold steady" — until it moves in.
          if (!e.faceOk || !e.faceInsideOval) {
            if (!e.facePresent) {
              setStatus(t('verificationCaptureStatusAlignFace', 'Center your face inside the guide'));
            } else if (e.faceObstructed) {
              setStatus(t('verificationCaptureStatusShowFace', 'Make sure your face is visible'));
            } else {
              setStatus(t('verificationCaptureStatusAlignFace', 'Center your face inside the guide'));
            }
          } else {
            setStatus(t('verificationCaptureStatusHoldSteady', 'Great, hold steady...'));
          }
        } else if (!e.faceOk) {
          if (!e.facePresent) {
            setStatus(t('verificationCaptureStatusAlignFace', 'Center your face inside the guide'));
          } else if (e.faceObstructed) {
            setStatus(t('verificationCaptureStatusShowFace', 'Make sure your face is visible'));
          } else {
            setStatus(t('verificationCaptureStatusAlignFace', 'Center your face inside the guide'));
          }
          } else if (e.matchesGesture && requiredHand && e.hand && (e.handVerdict === 'wrong' || e.hintWrongHand)) {
          announceWrongHand(e);
        } else if (!e.handPlacementOk) {
          setStatus(t('verificationCaptureStatusPositionHand', 'Place your hand in the gesture area and show the gesture'));
        } else if (!e.matchesGesture) {
          setStatus(t('verificationCaptureStatusPositionHand', 'Place your hand in the gesture area and show the gesture'));
        } else if (!e.gestureDetected) {
          setStatus(t('verificationCaptureStatusHoldSteady', 'Great, hold steady...'));
        } else {
          setStatus(t('verificationCaptureStatusHoldSteady', 'Great, hold steady...'));
        }
      }

      // Adaptive performance: slow inference (software WASM, old WebView)
      // drops to a lower frame rate with a longer face-stale window instead
      // of stalling with stale landmarks and a frozen progress bar.
      var inferMs = 0;
      try {
        inferMs = performance.now() - inferStart;
      } catch (_) {}
      inferMsAvg = inferMsAvg ? inferMsAvg * 0.8 + inferMs * 0.2 : inferMs;
      if (!slowDevice) {
        if (inferMsAvg > SLOW_INFER_MS) {
          slowStreak++;
          if (slowStreak >= 6) markSlowDevice();
        } else {
          slowStreak = 0;
        }
      }
      if (frameIndex % 20 === 0) {
        reportLog('metrics', {
          fps: slowDevice ? FPS_SLOW : FPS,
          inferMsAvg: Math.round(inferMsAvg),
          frameScore: Math.round(e.frameScore * 100) / 100,
          windowAvg: Math.round(summary.avg * 100) / 100,
          faceOk: e.faceOk,
          facePresent: e.facePresent,
          obstructed: e.faceObstructed,
          faceLitOk: e.faceLitOk,
          faceLuma: e.faceLuma == null ? -1 : Math.round(e.faceLuma),
          gesture: name0(e),
          gestureScore: Math.round(e.gestureScore * 100) / 100,
          hand: e.hand,
          mirroredHand: e.matchesHandMirrored,
          handVerdict: e.handVerdict,
          chirality: e.chiralitySign,
          chiralityMag: e.chiralityMagnitude,
          flipFrames: flipFrames,
          pipelineFlipped: flipFrames >= 8,
          handRoi: Math.round(e.handRoiScore * 100) / 100,
          stableFrames: stableFrames,
          videoW: video.videoWidth || 0,
          videoH: video.videoHeight || 0
        });
      }
      // If the user has been compliant-looking for a while with no pass,
      // send a diagnostics snapshot so support can see which gate is stuck.
      if (!ready && now - firstTickAt > STUCK_REPORT_MS && now - lastStuckReportAt > 15000) {
        lastStuckReportAt = now;
        reportLog('stuck', {
          windowAvg: Math.round(summary.avg * 100) / 100,
          faceHitRate: Math.round(summary.faceHitRate * 100) / 100,
          gestureHitRate: Math.round(summary.gestureHitRate * 100) / 100,
          faceOk: e.faceOk,
          facePresent: e.facePresent,
          obstructed: e.faceObstructed,
          faceLitOk: e.faceLitOk,
          faceLuma: e.faceLuma == null ? -1 : Math.round(e.faceLuma),
          faceQuality: Math.round(e.faceQualityScore * 100) / 100,
          gestureScore: Math.round(e.gestureScore * 100) / 100,
          hand: e.hand,
          mirroredHand: e.matchesHandMirrored,
          handVerdict: e.handVerdict,
          chirality: e.chiralitySign,
          chiralityMag: e.chiralityMagnitude,
          flipFrames: flipFrames,
          pipelineFlipped: flipFrames >= 8,
          handRoi: Math.round(e.handRoiScore * 100) / 100,
          handPlacementOk: e.handPlacementOk,
          inferMsAvg: Math.round(inferMsAvg),
          slowDevice: slowDevice,
          videoW: video.videoWidth || 0,
          videoH: video.videoHeight || 0
        }, true);
      }
      try {
        updateDebugOverlay(
          'fps=' + (slowDevice ? FPS_SLOW : FPS) +
          ' infer=' + Math.round(inferMsAvg) + 'ms' +
          ' frame=' + frameIndex +
          '\nface ok=' + e.faceOk + ' present=' + e.facePresent +
          ' obstructed=' + e.faceObstructed +
          ' q=' + Math.round(e.faceQualityScore * 100) / 100 +
          '\ngesture score=' + Math.round(e.gestureScore * 100) / 100 +
          ' hand=' + (e.hand || '-') +
          (e.matchesHandMirrored ? ' (mirrored-label)' : '') +
          ' verdict=' + e.handVerdict +
          ' chir=' + (e.chiralitySign > 0 ? '+' : '') + e.chiralitySign +
          '/' + e.chiralityMagnitude +
          (flipFrames >= 8 ? ' FLIPPED' : '') +
          ' roi=' + Math.round(e.handRoiScore * 100) / 100 +
          '\nframeScore=' + Math.round(e.frameScore * 100) / 100 +
          ' avg=' + Math.round(summary.avg * 100) / 100 +
          ' stable=' + stableFrames +
          '\nvideo=' + (video.videoWidth || 0) + 'x' + (video.videoHeight || 0) +
          (slowDevice ? ' SLOW' : '')
        );
      } catch (_) {}
      tickInProgress = false;
    } catch (err) {
      tickInProgress = false;
      try {
        reportLog('error', { stage: 'tick', message: String((err && err.message) || err || '').slice(0, 300) });
      } catch (_) {}
    }
  }

  function name0(e) {
    try {
      return e && e.matchesGesture ? requiredGesture : '';
    } catch (_) {
      return '';
    }
  }

  function triggerAutoCapture() {
    if (hasCaptured) return;
    try {
      reportLog('captureTiming', {
        stage: 'triggerAutoCapture',
        tMs: Date.now() - bootStart,
        selectionMs: captureSelectionStartedAt ? Date.now() - captureSelectionStartedAt : -1
      }, true);
    } catch (_) {}
    hasCaptured = true;
    try {
      captureBtn.disabled = true;
    } catch (_) {}
    try {
      if (tickTimer) {
        clearInterval(tickTimer);
        tickTimer = null;
      }
    } catch (_) {}
    captureSafely(0, bestFrame && bestFrame.dataUrl ? bestFrame.dataUrl : null);
  }

  function captureSafely(attempt, bestDataUrl) {
    try {
      if (bestDataUrl) {
        captureFromDataUrl(bestDataUrl);
        return;
      }
      if (video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2) {
        capture();
        return;
      }
    } catch (_) {}
    if (attempt >= MAX_CAPTURE_ATTEMPTS) {
      capture();
      return;
    }
    setTimeout(function() { captureSafely(attempt + 1, bestDataUrl); }, 50);
  }

  function capture() {
    if (usingInputImage) {
      window.sendVerificationPhoto(inputImageBase64);
      return;
    }
    var dataUrl = snapshotToDataUrl();
    captureFromDataUrl(dataUrl);
  }

  captureBtn.addEventListener('click', function() {
    if (captureBtn.disabled) return;
    capture();
  });

  function analyzeInputPhoto(vision) {
    setInstruction(gestureLabel);
    setStatus(t('verificationCaptureLoading', 'Loading camera & gesture recognition...'));

    createResolverPromise(vision)
      .then(function(resolver) {
        return Promise.all([
          vision.GestureRecognizer.createFromOptions(resolver, {
            baseOptions: {
              modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task'
            },
            runningMode: 'IMAGE',
            numHands: 1,
            minHandDetectionConfidence: 0.45,
            minHandPresenceConfidence: 0.45,
            minTrackingConfidence: 0.45
          }),
          vision.FaceLandmarker.createFromOptions(resolver, {
            baseOptions: {
              modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
            },
            runningMode: 'IMAGE',
            numFaces: 1,
            minFaceDetectionConfidence: 0.45,
            minFacePresenceConfidence: 0.45,
            minTrackingConfidence: 0.45,
            outputFaceBlendshapes: false,
            outputFacialTransformationMatrixes: false
          }),
        ]);
      }).then(function(recognizer) {
        gestureRecognizer = recognizer[0];
        faceLandmarker = recognizer[1];
        return createImageBitmap(
          (function() {
            var bytes = atob(inputImageBase64);
            var arr = new Uint8Array(bytes.length);
            for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
            return new Blob([arr], { type: 'image/jpeg' });
          })(),
        );
      }).then(function(bitmap) {
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        ctx.drawImage(bitmap, 0, 0);
        var faceResults = faceLandmarker.detect(bitmap);
        var gestureResults = gestureRecognizer.recognize(bitmap);
        var faceLandmarks = (faceResults && faceResults.faceLandmarks && faceResults.faceLandmarks.length > 0)
          ? faceResults.faceLandmarks[0]
          : null;
        var e = evaluateFrame(faceLandmarks, gestureResults);
        setGestureRoiPose(e.faceBox);
        var visualHandReady = e.handPlacementOk || e.gestureStrong;
        setChecklistState(e.faceOk, visualHandReady, e.gestureChecklistReady, e.faceLitOk);
        ready = e.faceOk && visualHandReady && e.gestureChecklistReady;
        setReady(ready);
        setInstruction(gestureLabel);
        if (!ready) {
          if (!e.faceOk) {
            setStatus(t('verificationCaptureStatusAlignFace', 'Center your face inside the guide'));
        } else if (e.matchesGesture && requiredHand && e.hand && (e.handVerdict === 'wrong' || e.hintWrongHand)) {
            announceWrongHand(e);
          } else if (!e.handPlacementOk) {
            setStatus(t('verificationCaptureStatusPositionHand', 'Place your hand in the gesture area and show the gesture'));
          } else if (!e.matchesGesture) {
            setStatus(t('verificationCaptureStatusShowGesture', 'Show the required gesture'));
          } else {
            setStatus(t('verificationCaptureStatusHoldSteady', 'Great, hold steady...'));
          }
        } else {
          setStatus(t('verificationCaptureStatusGestureDetected', 'Gesture detected. Tap to continue'));
        }
      }).catch(function(err) {
        var msg = (err && (err.message || err)) || 'Unknown error';
        showFatalError(
          t('verificationCaptureCameraOrModelError', 'Camera or model error: {error}').replace('{error}', msg),
          String(msg),
        );
      });
  }

  function startCameraPreview(cameraStream) {
    stream = cameraStream;
    video.srcObject = stream;
    video.muted = true;
    video.autoplay = true;
    video.playsInline = true;
    try { video.setAttribute('playsinline', 'true'); } catch (_) {}
    try { video.setAttribute('webkit-playsinline', 'true'); } catch (_) {}
    return new Promise(function(resolve) {
      var settled = false;
      function finish() {
        if (settled) return;
        settled = true;
        resolve();
      }
      function cleanup() {
        video.removeEventListener('loadedmetadata', onVideoReadyEvent);
        video.removeEventListener('canplay', onVideoReadyEvent);
      }
      function hasUsableFrame() {
        return video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0;
      }
      function onVideoReadyEvent() {
        if (hasUsableFrame()) {
          cleanup();
          finish();
        }
      }
      video.addEventListener('loadedmetadata', onVideoReadyEvent, { once: true });
      video.addEventListener('canplay', onVideoReadyEvent, { once: true });
      if (hasUsableFrame()) {
        cleanup();
        finish();
        return;
      }
      var playPromise = null;
      try {
        playPromise = video.play();
      } catch (_) {}
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(function() {
          var retries = 0;
          (function waitForFrame() {
            if (hasUsableFrame()) {
              cleanup();
              finish();
              return;
            }
            retries++;
            if (retries >= 20) {
              cleanup();
              finish();
              return;
            }
            setTimeout(waitForFrame, 100);
          })();
        }).catch(function() {
          cleanup();
          finish();
        });
      }
      setTimeout(function() {
        cleanup();
        finish();
      }, 1500);
    });
  }

  // Waits (briefly) for the preview to deliver its first usable frame,
  // re-issuing play() a few times for WebView autoplay-policy races. Resolves
  // false when the preview never started so the caller can show a retryable
  // error instead of stalling on a dead preview.
  function ensureVideoPreviewUsable() {
    return new Promise(function(resolve) {
      var attempts = 0;
      (function check() {
        if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
          resolve(true);
          return;
        }
        attempts++;
        if (attempts > 40) {
          resolve(false);
          return;
        }
        if (attempts % 10 === 0) {
          try {
            var p = video.play();
            if (p && typeof p.catch === 'function') p.catch(function() {});
          } catch (_) {}
        }
        setTimeout(check, 100);
      })();
    });
  }

  function importWithTimeout(url, ms) {
    return new Promise(function(resolve, reject) {
      var done = false;
      var timer = setTimeout(function() {
        if (!done) {
          done = true;
          reject(new Error('Timed out after ' + ms + 'ms loading ' + url));
        }
      }, ms);
      try {
        import(url).then(
          function(mod) {
            if (!done) {
              done = true;
              clearTimeout(timer);
              resolve(mod);
            }
          },
          function(err) {
            if (!done) {
              done = true;
              clearTimeout(timer);
              reject(err);
            }
          },
        );
      } catch (err) {
        if (!done) {
          done = true;
          clearTimeout(timer);
          reject(err);
        }
      }
    });
  }

  function loadVisionModuleWithFallback() {
    var lastError = null;
    function tryAt(index) {
      if (index >= MEDIAPIPE_SOURCES.length) {
        return Promise.reject(lastError || new Error('No MediaPipe source available'));
      }
      var source = MEDIAPIPE_SOURCES[index];
      return importWithTimeout(source.moduleUrl, MODEL_LOAD_TIMEOUT_MS).then(function(mod) {
        selectedMediaPipeSource = source;
        return mod.default || mod;
      }).catch(function(err) {
        lastError = err;
        reportLog('warn', { stage: 'cdn', source: source.moduleUrl, message: String((err && err.message) || err || '').slice(0, 200) });
        return tryAt(index + 1);
      });
    }
    return tryAt(0);
  }

  function createResolverPromise(vision) {
    if (!selectedMediaPipeSource || !selectedMediaPipeSource.wasmRootUrl) {
      return Promise.reject(new Error('MediaPipe source was not initialized'));
    }
    return vision.FilesetResolver.forVisionTasks(selectedMediaPipeSource.wasmRootUrl);
  }

  function run(vision) {
    if (usingInputImage) {
      analyzeInputPhoto(vision);
      return;
    }
    setGestureRoiPose(null);
    setInstruction(gestureLabel);
    setStatus(t('verificationCaptureLoading', 'Loading camera & gesture recognition...'));

    var resolverPromise = createResolverPromise(vision);
    var cameraPromise = navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(function(cameraStream) {
      return startCameraPreview(cameraStream);
    });
    // getUserMedia can hang forever in some WebViews (permission dialog
    // ignored, camera HAL wedged). Fail visibly after 25s instead of
    // spinning on "Loading camera..." forever.
    var cameraTimeoutPromise = new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('Camera start timed out')); }, 25000);
    });
    cameraPromise.catch(function() {}); // late rejection must not be unhandled
    var cameraReadyPromise = Promise.race([cameraPromise, cameraTimeoutPromise]);

    Promise.all([resolverPromise, cameraReadyPromise]).then(function(arr) {
      var resolver = arr[0];
      return Promise.all([
        vision.GestureRecognizer.createFromOptions(resolver, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task'
          },
          runningMode: 'VIDEO',
          numHands: 1,
          minHandDetectionConfidence: 0.45,
          minHandPresenceConfidence: 0.45,
          minTrackingConfidence: 0.45
        }),
        vision.FaceLandmarker.createFromOptions(resolver, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
          },
          runningMode: 'VIDEO',
          numFaces: 1,
          minFaceDetectionConfidence: 0.45,
          minFacePresenceConfidence: 0.45,
          minTrackingConfidence: 0.45,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: false
        })
      ]);
    }).then(function(recognizer) {
      gestureRecognizer = recognizer[0];
      faceLandmarker = recognizer[1];
      // startCameraPreview resolves even when no frame ever arrived (its
      // 1.5s wait is best-effort). Retry play() briefly, then show a
      // retryable error instead of a dead gray preview with no message.
      return ensureVideoPreviewUsable().then(function(usable) {
        if (!usable) {
          reportLog('stuck', {
            stage: 'videoNeverStarted',
            readyState: video.readyState,
            videoW: video.videoWidth || 0,
            videoH: video.videoHeight || 0
          }, true);
          showFatalError(
            t('verificationCaptureCameraOrModelError', 'Camera or model error: {error}').replace('{error}', 'Camera preview did not start'),
            'Camera preview did not start'
          );
          return;
        }
        setInstruction(gestureLabel);
        setStatus(isFaceOnlyMode
          ? t('verificationCaptureStatusAlignFace', 'Center your face inside the guide')
          : t('verificationCaptureStatusShowGesture', 'Show the required gesture'));
        reportLog('ready', {
          source: selectedMediaPipeSource ? selectedMediaPipeSource.moduleUrl : null,
          videoW: video.videoWidth || 0,
          videoH: video.videoHeight || 0,
          bootMs: Date.now() - bootStart
        });
        setTickRate(slowDevice ? FPS_SLOW : FPS);
      });
    }).catch(function(err) {
      var msg = (err && (err.message || err)) || 'Unknown error';
      var cameraDenied = false;
      try {
        cameraDenied = /denied|notallowed|permission/i.test(String(msg));
      } catch (_) {}
      showFatalError(
        cameraDenied
          ? t('verificationCaptureCameraPermissionDenied', 'Camera permission denied. Please allow camera access and retry.')
          : t('verificationCaptureCameraOrModelError', 'Camera or model error: {error}').replace('{error}', msg),
        String(msg),
      );
    });
  }

  function boot() {
    if (booted) {
      // Re-entry via Retry: reset per-session detection state.
      try {
        if (tickTimer) {
          clearInterval(tickTimer);
          tickTimer = null;
        }
      } catch (_) {}
      gestureRecognizer = null;
      faceLandmarker = null;
      lastFaceSeenAt = 0;
      lastFaceLandmarks = null;
      ready = false;
      hasCaptured = false;
      scoreWindow = [];
      readySince = null;
      captureSelectionStartedAt = null;
      bestFrame = null;
      capturePlanned = false;
      previousFaceCenter = null;
      stableFrames = 0;
      slowStreak = 0;
      firstTickAt = 0;
      lastStuckReportAt = 0;
      tickInProgress = false;
      videoStallWatchStart = 0;
      videoStallFatalShown = false;
    }
    booted = true;
    hideFatalError();
    setGestureRoiPose(null);
    setInstruction(gestureLabel);
    setStatus(t('verificationCaptureLoading', 'Loading camera & gesture recognition...'));
    loadVisionModuleWithFallback().then(function(vision) {
      run(vision);
    }).catch(function(err) {
      var msg = (err && (err.message || err)) || 'Unknown error';
      showFatalError(
        t('verificationCaptureFailedToLoad', 'Failed to load: {error}').replace('{error}', msg),
        String(msg),
      );
    });
  }

  try {
    var retryBtnEl = document.getElementById('retryBtn');
    if (retryBtnEl) {
      retryBtnEl.addEventListener('click', function() {
        try {
          window.__captureRetry();
        } catch (_) {}
      });
    }
  } catch (_) {}

  boot();
})();
  </script>
</body>

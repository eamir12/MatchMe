group 'com.revenuecat.purchases_ui_flutter'
version '10.16.0'

buildscript {
    ext.kotlin_version = '1.9.20'
    ext.common_version = '19.12.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// NOTE: kotlin-android is deliberately NOT applied here. While the app keeps
// android.builtInKotlin=false, the app's root build.gradle.kts applies KGP to
// every Android library subproject. Re-applying it from a plugin is what
// Flutter's "plugins that apply Kotlin Gradle Plugin (KGP)" warning flags, and
// it must be gone before Flutter hard-fails on it (flutter/flutter#184837).

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.revenuecat.purchases_ui_flutter'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
        compileSdk 34
        // Fix variant resolution for purchases-android local builds
        missingDimensionStrategy 'apis', 'defaults'
        missingDimensionStrategy 'billingclient', 'bc8'
    }
    
    dependencies {
        implementation "com.revenuecat.purchases:purchases-hybrid-common-ui:$common_version"
        implementation 'androidx.compose.ui:ui-android:1.5.4'
    }
}

// KGP < 1.9 has no `compilerOptions` on the `kotlin` extension; AGP's built-in Kotlin has no
// `kotlinOptions` on `android`.
def kotlinExtension = project.extensions.getByName('kotlin')
if (kotlinExtension.metaClass.respondsTo(kotlinExtension, 'compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }
}

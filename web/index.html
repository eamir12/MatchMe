<!DOCTYPE html>
<html>
<head>
  <!--

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Hebrew:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="matchme">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>matchme</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Intl.Segmenter polyfill: load only if missing to silence Intl.v8BreakIterator deprecation and provide Segmenter support -->
  <script>
    (function(){
      try {
        if (!(Intl && Intl.Segmenter)) {
          var s = document.createElement('script');
          s.src = 'https://polyfill.io/v3/polyfill.min.js?features=Intl.Segmenter';
          s.defer = true;
          document.head.appendChild(s);
        }
      } catch (e) {
        console.warn('Intl.Segmenter polyfill loader failed', e);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Hebrew:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Ensure web uses Noto font families (and fallbacks) so missing glyphs are covered */
    html, body {
      font-family: 'Noto Sans', 'Noto Sans Hebrew', 'Noto Sans Arabic', 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>

  <style>
    /*
     * Pre-Flutter launch frame. Proportions mirror
     * lib/widgets/startup_loader.dart (_nativeLaunchWidth 96, the 0.27
     * narrow-screen factor, the 0.16 gap and the 0.135 font factor) so the
     * hand-off from this frame to the Flutter splash is invisible.
     *
     * #launch-loader is removed by the script in the body on
     * 'flutter-first-frame', with a timeout failsafe in case that event is
     * ever missed. It is pointer-events: none so it can never swallow a tap.
     */
    :root { --launch-logo-size: min(96px, 27vmin); }
    #launch-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      pointer-events: none;
    }
    #launch-loader img {
      width: var(--launch-logo-size);
      height: auto;
    }
    #launch-loader .tagline {
      margin-top: calc(var(--launch-logo-size) * 0.16);
      font-size: calc(var(--launch-logo-size) * 0.135);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.02em;
      color: #46464f;
      text-align: center;
    }
  </style>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="google-signin-client_id" content="988596890235-q4jdj3eu4r74tik21dlstolgsco2oel7.apps.googleusercontent.com">
  <meta name="description" content="MatchMe helps you meet people nearby through shared interests, intentions, and real-world moments.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MatchMe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MatchMe</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="launch-loader">
    <img src="assets/assets/images/logo.png" alt="" onerror="this.style.display='none'">
    <div class="tagline">Connecting people, naturally!</div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('launch-loader');
      if (!loader) return;
      var removed = false;
      function remove() {
        if (removed) return;
        removed = true;
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }
      // The engine dispatches 'flutter-first-frame' on the window once the
      // first frame is painted (flutter_web_sdk platform_dispatcher.dart).
      window.addEventListener('flutter-first-frame', remove);
      // Failsafe: on a very slow load, drop the frame rather than let it sit
      // over a live app. Harmless if it fires after the app is already up.
      setTimeout(remove, 15000);
    })();
  </script>
  <script>
    (function () {
      try {
        var originalWarn = console.warn;
        console.warn = function () {
          try {
            var first = arguments && arguments.length ? String(arguments[0]) : '';
            if (
              first.indexOf('[GSI_LOGGER]') !== -1 &&
              (first.indexOf('Google One Tap prompt UI status methods') !== -1 ||
                first.indexOf('fedcm-migration') !== -1 ||
                first.indexOf('FedCM becomes mandatory') !== -1)
            ) {
              return;
            }
            if (
              first.indexOf('[GSI_LOGGER-TOKEN_CLIENT]') !== -1 &&
              first.indexOf('gapi.client library is not loaded') !== -1
            ) {
              return;
            }
          } catch (_) {}
          return originalWarn.apply(console, arguments);
        };
      } catch (_) {}
    })();
  </script>
  <script>
    (function () {
      try {
        if (!window.performance || typeof window.performance.measure !== 'function') return;
        var originalMeasure = window.performance.measure.bind(window.performance);
        window.performance.measure = function () {
          try {
            return originalMeasure.apply(window.performance, arguments);
          } catch (e) {
            try {
              var msg = String((e && e.message) ? e.message : e);
              if (msg.indexOf("The mark '") !== -1 && msg.indexOf("' does not exist") !== -1) {
                try {
                  return originalMeasure(arguments[0]);
                } catch (_) {
                  return;
                }
              }
            } catch (_) {}
            throw e;
          }
        };
      } catch (_) {}
    })();
  </script>
  <!-- 
    NOTE: Google Sign-In (GIS) and Cross-Origin-Opener-Policy (COOP)
    
    If you see "Cross-Origin-Opener-Policy policy would block the window.closed call" in the console,
    it is because the Google Identity Services SDK tries to access the popup window state, but 
    browser security policies block it when strict COOP isolation is not configured.
    
    This is typically a warning and does not break authentication flow.
    
    To fix this message in production, configure your web server (Firebase, Vercel, Nginx, etc.)
    to serve this file with the following headers:
    
    Cross-Origin-Opener-Policy: same-origin-allow-popups
    Cross-Origin-Embedder-Policy: require-corp
  -->
  <script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js"></script>
  <script>
    (function() {
      // Twemoji parse helper: parse existing nodes and observe new ones
      function parseTwemoji(root) {
        try {
          if (window.twemoji && root) {
            // Use SVG for crisp, scalable emoji rendering
            window.twemoji.parse(root, {folder: 'svg', ext: '.svg'});
          }
        } catch (e) {
          console.warn('twemoji parse failed', e);
        }
      }

      // Expose helper so Flutter web code can call it if desired
      window.twemojiParse = function() { parseTwemoji(document.body); };

      document.addEventListener('DOMContentLoaded', function() { parseTwemoji(document.body); });

      // Observe DOM mutations so that dynamically-added emoji (e.g., from tooltips/overlays)
      // are also replaced with Twemoji images when possible.
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          if (m.addedNodes && m.addedNodes.length) {
            m.addedNodes.forEach(function(node) {
              if (node.nodeType === Node.ELEMENT_NODE) {
                parseTwemoji(node);
              }
            });
          }
        });
      });
      observer.observe(document.body, {childList: true, subtree: true});
    })();
  </script>

  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    (function () {
      try {
        window.__matchMeGapiClientReady = false;
        if (window.gapi && typeof window.gapi.load === 'function') {
          window.gapi.load('client', function () {
            window.__matchMeGapiClientReady = true;
          });
        }
      } catch (_) {}
    })();
  </script>

  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js" 
          integrity="sha384-PARf28kmic36Ve+O3DnUerRXFtOQ7ZDqRDGpLcbljly5/N39T2OV3kt3QsWOKeAX"
          crossorigin="anonymous"
          onerror="console.error('❌ MSAL.js failed to load from CDN')"></script>
  <script>
    if (typeof msal === 'undefined') {
      document.write(
        unescape(
          "<script src='https://alcdn.msftauth.net/browser/2.35.0/js/msal-browser.min.js' type='text/javascript' crossorigin='anonymous'><\/script>"
        )
      );
    }
  </script>
  <script>
    // Verify MSAL loaded correctly with detailed logging
    console.log('[MSAL Check] Script tag executed');
    console.log('[MSAL Check] typeof window:', typeof window);
    console.log('[MSAL Check] typeof msal:', typeof msal);
    console.log('[MSAL Check] typeof window.msal:', typeof window.msal);
    console.log('[MSAL Check] window keys:', Object.keys(window).filter(k => k.toLowerCase().includes('msal')));
    
    // Check for global msal object
    if (typeof msal !== 'undefined') {
      console.log('✅ [MSAL] Global msal object exists');
      console.log('[MSAL] msal keys:', Object.keys(msal));
      if (msal.PublicClientApplication) {
        console.log('✅ [MSAL] msal.PublicClientApplication constructor found');
        
        // Test creating an instance to check methods
        try {
          const testConfig = {
            auth: { clientId: 'test', authority: 'https://login.microsoftonline.com/common' }
          };
          const testInstance = new msal.PublicClientApplication(testConfig);
          console.log('[MSAL] Test instance created');
          console.log('[MSAL] Instance has initialize:', typeof testInstance.initialize);
          console.log('[MSAL] Instance methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(testInstance)));
        } catch (e) {
          console.warn('[MSAL] Could not create test instance:', e);
        }
      }
    }
    
    // Check for window.msal
    if (typeof window.msal !== 'undefined') {
      console.log('✅ [MSAL] window.msal object exists');
      console.log('[MSAL] window.msal keys:', Object.keys(window.msal));
      if (window.msal.PublicClientApplication) {
        console.log('✅ [MSAL] window.msal.PublicClientApplication constructor found');
      }
    }
    
    // If neither exists, log error
    if (typeof msal === 'undefined' && typeof window.msal === 'undefined') {
      console.error('❌ [MSAL] Library failed to load - no msal object found anywhere');
      console.error('[MSAL] This may be due to:');
      console.error('  1. CDN blocked by firewall/network');
      console.error('  2. CORS policy blocking the script');
      console.error('  3. Script failed to download');
      console.error('  4. Check Network tab in DevTools for failed requests');
    }
  </script>

  <!-- Required by the passkeys package for WebAuthn support on web. -->
  <script src="bundle.js" type="application/javascript"></script>
  <!-- Local photo prescreen (MediaPipe FaceDetector + PoseLandmarker for web parity with mobile). -->
  <script src="photo_prescreen.js" defer></script>
  <!-- Global error handler to catch CanvasKit late initialization error -->
  <script>
    window.addEventListener('error', function(event) {
      if (event.message && event.message.includes('_handledContextLostEvent')) {
        event.preventDefault();
        event.stopPropagation();
        console.warn('Caught CanvasKit initialization error (ignoring):', event.message);
        return false;
      }
    });
    window.addEventListener('unhandledrejection', function(event) {
      if (event.reason && event.reason.message && event.reason.message.includes('_handledContextLostEvent')) {
        event.preventDefault();
        console.warn('Caught CanvasKit initialization rejection (ignoring):', event.reason.message);
        return false;
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

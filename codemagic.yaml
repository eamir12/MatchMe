workflows:
  ios_unsigned_for_sideloadly:
    name: iOS Unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ~/.pub-cache
        - ~/.cocoapods/repos
        - ios/Pods
    scripts:
      - name: Flutter version
        script: |
          flutter --version
      - name: Prepare workspace
        script: |
          rm -rf build Runner-unsigned.ipa
          flutter pub get
      - name: Verify sideload entitlements mode
        script: |
          grep -q 'MM_CODE_SIGN_ENTITLEMENTS_FILE=Runner/Runner.sideload.entitlements' ios/Flutter/Signing.xcconfig
      - name: Verify iOS fullscreen keys
        script: |
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" ios/Runner/Info.plist
      - name: Flutter analyze (main app only)
        script: |
          flutter analyze lib
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Build iOS unsigned IPA
        script: |
          flutter build ios --release --no-codesign
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          fi
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r -y Runner-unsigned.ipa Payload
    artifacts:
      - Runner-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - build/ios/archive/Runner.xcarchive

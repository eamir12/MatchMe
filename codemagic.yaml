workflows:
  ios_unsigned_for_sideloadly:
    name: iOS Unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pre-clean workspace
        script: |
          rm -rf build Payload Runner-unsigned.ipa
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
      - name: Flutter clean/get
        script: |
          flutter clean
          flutter pub get
      - name: Verify iOS fullscreen keys
        script: |
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" ios/Runner/Info.plist
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Build iOS without codesign
        script: |
          flutter build ios --release --no-codesign
      - name: Create unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -y Runner-unsigned.ipa Payload
    artifacts:
      - Runner-unsigned.ipa
      - build/ios/iphoneos/Runner.app

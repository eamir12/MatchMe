workflows:
  ios_unsigned_for_sideloadly:
    name: iOS Unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods
    scripts:
      - name: Flutter version
        script: |
          flutter --version
      - name: Prepare workspace
        script: |
          rm -rf build Runner-unsigned.ipa Runner-sideloadly-clean.ipa
          flutter pub get
      - name: Verify sideload entitlements mode
        script: |
          grep -q 'MM_CODE_SIGN_ENTITLEMENTS_FILE=Runner/Runner.sideload.entitlements' ios/Flutter/Signing.xcconfig
      - name: Verify iOS fullscreen keys
        script: |
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" ios/Runner/Info.plist
      - name: Flutter analyze (main app only)
        script: |
          flutter analyze lib
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Build iOS unsigned IPA
        script: |
          rm -rf build/ios/ipa Runner-unsigned.ipa Payload
          flutter build ipa --release --no-codesign
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -n "$IPA_PATH" ] && [ -f "$IPA_PATH" ]; then
            cp "$IPA_PATH" Runner-unsigned.ipa
          else
            flutter build ios --release --no-codesign
            APP_PATH="build/ios/iphoneos/Runner.app"
            if [ ! -d "$APP_PATH" ]; then
              APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
            fi
            test -d "$APP_PATH"
            /usr/bin/xattr -cr "$APP_PATH" || true
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/Runner.app
            test -f Payload/Runner.app/Info.plist
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Runner-unsigned.ipa
          fi
          test -f Runner-unsigned.ipa
      - name: Sanitize IPA for re-signing tools
        script: |
          rm -rf ipa_tmp
          mkdir -p ipa_tmp
          cd ipa_tmp
          unzip -q ../Runner-unsigned.ipa
          find Payload -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find Payload -name "embedded.mobileprovision" -type f -delete
          test -d Payload/Runner.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../Runner-sideloadly-clean.ipa
          cd ..
          rm -rf ipa_tmp
      - name: Validate unsigned IPA structure
        script: |
          test -f Runner-sideloadly-clean.ipa
          unzip -Z1 Runner-sideloadly-clean.ipa | grep -q '^Payload/Runner.app/Info.plist$'
          unzip -Z1 Runner-sideloadly-clean.ipa | grep -q '^Payload/Runner.app/Runner$'
      - name: Show final artifact name
        script: |
          ls -lh Runner-sideloadly-clean.ipa
      - name: Cleanup temporary files
        script: |
          rm -rf Payload build/ios/archive build/ios/iphoneos build/ios/ipa Runner-unsigned.ipa
    artifacts:
      - Runner-sideloadly-clean.ipa
